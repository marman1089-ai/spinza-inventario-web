{% extends "base.html" %}
{% set title = "Admin Login - Spinza Inventario" %}
{% block content %}
  <div class="card" style="max-width:420px;margin:20px auto;">
    <h2 style="margin:0 0 10px 0;">Accesso Admin</h2>
    <p class="muted" style="margin-top:0;">Solo amministratore.</p>
    {% if error %}
      <div class="danger" style="padding:10px 12px;border-radius:12px;margin:10px 0;">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin-login">
      <div style="display:grid;gap:10px;">
        <input name="username" placeholder="Username admin" autocomplete="username" required />
        <input name="password" placeholder="Password admin" type="password" autocomplete="current-password" required />
        <button class="btn" type="submit">Entra come admin</button>
        <a class="pill" href="/" style="text-decoration:none;color:#111;text-align:center;">↩ Torna</a>
      </div>
    </form>
  </div>
{% endblock %}
