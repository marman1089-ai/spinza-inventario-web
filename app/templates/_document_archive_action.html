{% if r.id in fresh_ids %}{% if fresh_jobs[r.id]=='done' %}<a class="shine-button" href="/schede/{{ document_kind }}/{{ r.id }}">Apri scheda digitale</a>{% elif fresh_jobs[r.id] in ['pending','working'] %}<span class="shine-button secondary closure-digital-progress" role="status" aria-live="polite" data-document-status="/schede/{{ document_kind }}/{{ r.id }}/stato" data-digital-url="/schede/{{ document_kind }}/{{ r.id }}"><span class="closure-digital-spinner" aria-hidden="true"></span>In corso</span>{% elif fresh_jobs[r.id]=='paused' %}<span class="muted">Lettura sospesa</span>{% else %}<span class="muted">Lettura non riuscita</span>{% endif %}{% endif %}
